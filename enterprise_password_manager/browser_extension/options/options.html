<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>TICO BOX - Configuración</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, "Segoe UI", Roboto, sans-serif; background: #f2f4f8; color: #212121; min-height: 100vh; }
    .card { max-width: 520px; margin: 40px auto; background: #fff; border-radius: 12px; box-shadow: 0 2px 12px rgba(0,0,0,.08); padding: 24px; }
    h1 { font-size: 20px; margin-bottom: 4px; display: flex; align-items: center; gap: 10px; }
    h1 .logo { width: 34px; height: 34px; border-radius: 9px; background: linear-gradient(135deg,#1a237e,#3949ab); color: #fff; display: inline-flex; align-items: center; justify-content: center; font-size: 18px; }
    p.sub { color: #757575; font-size: 13px; margin-bottom: 20px; }
    label { display: block; font-size: 12px; color: #616161; margin-bottom: 16px; }
    input { width: 100%; margin-top: 6px; padding: 10px 12px; border: 1px solid #cfd8dc; border-radius: 6px; font-size: 14px; }
    input:focus { outline: 2px solid #3949ab; border-color: #3949ab; }
    .row { display: flex; gap: 8px; }
    button { border: none; border-radius: 6px; padding: 10px 16px; font-size: 13px; font-weight: 600; cursor: pointer; }
    .primary { background: #1a237e; color: #fff; }
    .primary:hover { background: #283593; }
    .ghost { background: #eceff1; color: #37474f; }
    .ghost:hover { background: #e0e0e0; }
    .msg { margin-top: 14px; font-size: 13px; min-height: 18px; }
    .ok { color: #2e7d32; }
    .err { color: #c62828; }
    ul.hints { margin-top: 18px; padding-left: 18px; color: #616161; font-size: 12px; line-height: 1.7; }
    .saved { background: #e8f5e9; border: 1px solid #a5d6a7; color: #2e7d32; border-radius: 8px; padding: 10px 12px; margin-top: 16px; display: none; }
  </style>
</head>
<body>
  <div class="card">
    <h1><span class="logo">T</span> TICO BOX - Configuración</h1>
    <p class="sub">Indica la URL del servidor de tu gestor de contraseñas.</p>

    <label>URL del servidor (base, sin /api)
      <input type="url" id="serverUrl" placeholder="http://localhost:8001">
    </label>

    <div class="row">
      <button class="primary" id="saveBtn">Guardar</button>
      <button class="ghost" id="testBtn">Probar conexión</button>
    </div>

    <p class="msg" id="msg"></p>
    <div class="saved" id="saved">Configuración guardada.</div>

    <ul class="hints">
      <li>Ejemplos: <code>http://localhost:8001</code> (desarrollo) o <code>https://tu-dominio.com</code>.</li>
      <li>El servidor debe exponer la API bajo <code>/api</code>.</li>
      <li>La sesión de la extensión es independiente de la sesión web.</li>
    </ul>
  </div>
  <script src="options.js"></script>
</body>
</html>
