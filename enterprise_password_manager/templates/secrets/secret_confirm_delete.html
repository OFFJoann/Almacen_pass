{% extends 'base.html' %}
{% block title %}Eliminar Secreto{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm border-danger">
            <div class="card-body text-center p-4">
                <i class="bi bi-exclamation-triangle display-1 text-danger"></i>
                <h4 class="mt-3">Eliminar Secreto</h4>
                <p>¿Estás seguro de eliminar <strong>{{ secret.name }}</strong>?</p>
                <span class="badge bg-{% if secret.type == 'api_key' %}warning{% elif secret.type == 'ssh_key' %}success{% elif secret.type == 'credit_card' %}info{% else %}secondary{% endif %}">
                    {{ secret.get_type_display }}
                </span>
                <form method="post" class="mt-3">{% csrf_token %}
                    <div class="d-flex gap-2 justify-content-center">
                        <button type="submit" class="btn btn-danger">
                            <i class="bi bi-trash"></i> Eliminar
                        </button>
                        <a href="{% url 'secrets:list' %}" class="btn btn-outline-secondary">Cancelar</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
