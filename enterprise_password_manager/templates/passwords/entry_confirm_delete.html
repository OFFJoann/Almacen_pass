{% extends 'base.html' %}
{% block title %}Eliminar Contraseña{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm border-danger">
            <div class="card-body text-center p-4">
                <i class="bi bi-exclamation-triangle display-1 text-danger"></i>
                <h4 class="mt-3">Eliminar Contraseña</h4>
                <p>¿Estás seguro de eliminar <strong>{{ entry.name }}</strong>?</p>
                <span class="badge bg-{% if entry.sensitivity == 'low' %}success{% elif entry.sensitivity == 'medium' %}warning{% elif entry.sensitivity == 'high' %}danger{% else %}dark{% endif %}">
                    {{ entry.get_sensitivity_display }}
                </span>
                <form method="post" class="mt-3">{% csrf_token %}
                    <div class="d-flex gap-2 justify-content-center">
                        <button type="submit" class="btn btn-danger">
                            <i class="bi bi-trash"></i> Eliminar
                        </button>
                        <a href="{% url 'passwords:vault' %}" class="btn btn-outline-secondary">Cancelar</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
