{% extends 'base.html' %}
{% load static %}

{% block title %}Importar Contraseñas{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm">
            <div class="card-body p-4">
                <h4 class="card-title mb-4"><i class="bi bi-upload"></i> Importar Contraseñas</h4>
                <div class="alert alert-info">
                    <i class="bi bi-info-circle"></i> Formatos soportados: Bitwarden JSON, KeePass XML, RoboForm CSV, CSV
                </div>
                <form method="post" enctype="multipart/form-data" novalidate>
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label">{{ form.source.label }}</label>
                        {{ form.source }}
                    </div>
                    <div class="mb-3">
                        <label class="form-label">{{ form.file.label }}</label>
                        {{ form.file }}
                    </div>
                    <button type="submit" class="btn btn-primary w-100">
<i class="bi bi-upload"></i> Importar
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
