{% for node in nodes %}
  <div class="folder-node tree-name-wrap">
    <div class="tree-item folder-row {% if active_folder == node.folder.id|stringformat:'s' %}active{% endif %}">
      <span class="d-flex flex-grow-1 align-items-center text-decoration-none folder-name">
        {% if node.children %}
          <i class="bi bi-chevron-down folder-toggle me-1" role="button" onclick="toggleFolder(this)" title="Desplegar / plegar"></i>
        {% else %}
          <span class="folder-toggle-placeholder me-1"></span>
        {% endif %}
        <a href="{% url 'passwords:vault' %}?folder={{ node.folder.id }}" class="text-decoration-none d-flex align-items-center gap-1 flex-grow-1 min-w-0 tree-name">
          <i class="bi bi-folder{% if active_folder == node.folder.id|stringformat:'s' %}-open{% endif %} folder-icon"></i>
          <span class="text-truncate tree-name-label">{{ node.folder.name }}</span>
        </a>
      </span>
      <div class="d-flex align-items-center gap-1 folder-actions tree-actions">
        <span class="badge bg-primary rounded-pill">{{ node.count }}</span>
        <a href="{% url 'passwords:folder_create' %}?parent={{ node.folder.id }}" class="text-success" title="Nueva subcarpeta"><i class="bi bi-folder-plus"></i></a>
        <a href="{% url 'passwords:folder_delete' node.folder.id %}" class="text-danger" title="Eliminar carpeta"><i class="bi bi-trash"></i></a>
      </div>
    </div>
    {% if node.children %}
      <div class="folder-children folder-child-indent">
        {% include 'passwords/includes/folder_node.html' with nodes=node.children active_folder=active_folder %}
      </div>
    {% endif %}
  </div>
{% endfor %}
