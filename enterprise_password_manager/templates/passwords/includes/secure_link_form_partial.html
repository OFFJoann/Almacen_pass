<form id="secureLinkForm-{{ kind }}-{{ pk }}" method="post" action="{% url 'passwords:secure_link_create' kind pk %}" class="secure-link-form">
    {% csrf_token %}
    <div class="mb-3">
        <label class="form-label">{{ form.days.label }}</label>
        {{ form.days }}
        <div class="form-text">{{ form.days.help_text }}</div>
        {% if form.days.errors %}
            <div class="text-danger small">{{ form.days.errors }}</div>
        {% endif %}
    </div>
    <div class="mb-1 small text-muted">
        <i class="bi bi-shield-exclamation"></i>
        Cualquier persona con el enlace podrá copiar las credenciales de <strong>{{ item.name }}</strong> sin iniciar sesión.
    </div>
    <div class="text-end">
        <button type="submit" class="btn btn-primary">
            <i class="bi bi-link-45deg"></i> Crear enlace
        </button>
    </div>
</form>
