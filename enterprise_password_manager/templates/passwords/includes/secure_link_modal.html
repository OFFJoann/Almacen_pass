<div class="modal fade" id="secureLinkModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h6 class="modal-title"><i class="bi bi-link-45deg"></i> Compartir por enlace temporal</h6>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
            </div>
            <div class="modal-body" id="secureLinkModalBody">
                <div class="text-center py-4"><i class="bi bi-arrow-repeat spin"></i> Cargando…</div>
            </div>
        </div>
    </div>
</div>
<script>
    var _secureLinkModal = null;
    var _secureLinkCsrf = null;
    var _secureLinksListUrl = "{% url 'passwords:secure_links_list' %}";
    var _secureLinkVaultBase = "{% url 'passwords:vault' %}";

    function openSecureLinkModal(kind, pk) {
        _secureLinkCsrf = document.querySelector('meta[name="csrf-token"]');
        _secureLinkCsrf = _secureLinkCsrf ? _secureLinkCsrf.getAttribute('content') : '';
        var modalEl = document.getElementById('secureLinkModal');
        var body = document.getElementById('secureLinkModalBody');
        if (body) body.innerHTML = '<div class="text-center py-4"><i class="bi bi-arrow-repeat spin"></i> Cargando…</div>';
        _secureLinkModal = new bootstrap.Modal(modalEl);
        _secureLinkModal.show();

        var base = _secureLinkVaultBase;
        var url = base + 'secure-link/create/' + kind + '/' + pk + '/';
        fetch(url, { headers: { 'X-Requested-With': 'XMLHttpRequest' } })
            .then(function (r) { return r.text(); })
            .then(function (html) {
                body.innerHTML = html;
                bindSecureLinkSubmit(kind, pk);
            })
            .catch(function () {
                body.innerHTML = '<div class="alert alert-danger mb-0">No se pudo cargar el formulario.</div>';
            });
    }

    function bindSecureLinkSubmit(kind, pk) {
        var form = document.getElementById('secureLinkForm-' + kind + '-' + pk);
        if (!form) return;
        form.addEventListener('submit', function (e) {
            e.preventDefault();
            var btn = form.querySelector('button[type="submit"]');
            if (btn) btn.disabled = true;
            fetch(form.action, {
                method: 'POST',
                body: new FormData(form),
                headers: {
                    'X-Requested-With': 'XMLHttpRequest',
                    'X-CSRFToken': _secureLinkCsrf
                }
            })
                .then(function (r) { return r.json(); })
                .then(function (data) {
                    if (data.status === 'ok') {
                        document.getElementById('secureLinkModalBody').innerHTML =
                            '<div class="text-center mb-3"><i class="bi bi-check-circle text-success" style="font-size:2.2rem;"></i></div>' +
                            '<p class="text-center mb-3">Enlace válido por <strong>' + data.days + ' día(s)</strong><br><small class="text-muted">Expira el ' + data.expires_at + '</small></p>' +
                            '<div class="input-group mb-1">' +
                            '<input type="text" class="form-control" readonly id="secureLinkResultUrl" value="' + data.url + '">' +
                            '<button class="btn btn-outline-secondary" type="button" onclick="copySecureLinkResult()" title="Copiar"><i class="bi bi-clipboard"></i></button>' +
                            '</div>' +
                            '<p class="ms-2 text-success small mb-2" id="secureLinkEmailMsg"></p>' +
                            '<div class="input-group input-group-sm mb-3">' +
                            '<input type="email" class="form-control" placeholder="Correo de destino" id="secureLinkEmail" value="">' +
                            '<button class="btn btn-outline-primary" type="button" onclick="sendSecureLinkByEmail(' + data.pk + ')">' +
                            '<i class="bi bi-envelope"></i> Enviar por correo</button>' +
                            '</div>' +
                            '<div class="d-flex justify-content-center gap-2 mb-1">' +
                            '<a href="' + _secureLinksListUrl + '" class="btn btn-sm btn-outline-secondary">Ver todos los enlaces</a>' +
                            '<button class="btn btn-sm btn-outline-primary" onclick="openSecureLinkModal(\'' + kind + '\', ' + pk + ')">Crear otro</button>' +
                            '</div>';
                    } else if (data.status === 'error' && data.html) {
                        document.getElementById('secureLinkModalBody').innerHTML = data.html;
                        if (btn) btn.disabled = false;
                        bindSecureLinkSubmit(kind, pk);
                    } else if (data.status === 'error' && data.message) {
                        document.getElementById('secureLinkModalBody').innerHTML =
                            '<div class="text-center py-3"><i class="bi bi-exclamation-triangle text-warning" style="font-size:2.2rem;"></i>' +
                            '<p class="mt-3 mb-1"><strong>No se puede crear el enlace</strong></p>' +
                            '<p class="text-muted mb-3">' + data.message + '</p>' +
                            '<a href="' + _secureLinksListUrl + '" class="btn btn-sm btn-outline-secondary"><i class="bi bi-list-ul"></i> Ver enlaces temporales</a></div>';
                        if (btn) btn.disabled = false;
                    } else {
                        if (btn) btn.disabled = false;
                        showToast('No se pudo crear el enlace', 'danger');
                    }
                })
                .catch(function () {
                    if (btn) btn.disabled = false;
                    showToast('Error de red', 'danger');
                });
        });
    }

    function copySecureLinkResult() {
        var input = document.getElementById('secureLinkResultUrl');
        if (!input) return;
        copyToClipboard(input.value).then(function () {
            showToast('Enlace copiado', 'success');
        });
    }

    function sendSecureLinkByEmail(pk) {
        var input = document.getElementById('secureLinkEmail');
        var msg = document.getElementById('secureLinkEmailMsg');
        if (!input) return;
        var email = input.value.trim();
        if (!email || email.indexOf('@') === -1) {
            if (msg) { msg.textContent = 'Ingresa un correo de destino válido.'; msg.className = 'ms-2 text-danger small mb-2'; }
            return;
        }
        if (msg) { msg.textContent = 'Enviando…'; msg.className = 'ms-2 text-muted small mb-2'; }
        var url = _secureLinkVaultBase + 'secure-links/' + pk + '/email/';
        var fd = new FormData();
        fd.append('email', email);
        fetch(url, {
            method: 'POST',
            body: fd,
            headers: {
                'X-Requested-With': 'XMLHttpRequest',
                'X-CSRFToken': _secureLinkCsrf
            }
        })
            .then(function (r) { return r.json(); })
            .then(function (data) {
                if (msg) {
                    if (data.status === 'ok') {
                        msg.textContent = data.message;
                        msg.className = 'ms-2 text-success small mb-2';
                        input.value = '';
                    } else {
                        msg.textContent = data.message || 'No se pudo enviar el correo.';
                        msg.className = 'ms-2 text-danger small mb-2';
                    }
                }
            })
            .catch(function () {
                if (msg) { msg.textContent = 'Error de red al enviar el correo.'; msg.className = 'ms-2 text-danger small mb-2'; }
            });
    }
</script>
