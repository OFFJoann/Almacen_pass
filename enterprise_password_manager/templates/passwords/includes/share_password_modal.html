<div class="modal fade" id="sharePasswordModal" tabindex="-1" aria-labelledby="sharePasswordModalLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h6 class="modal-title" id="sharePasswordModalLabel">
                    <i class="bi bi-share"></i> Compartir contraseña
                </h6>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
            </div>

            <div id="sharePwBody">
                <div class="modal-body">
                    <p class="text-muted small mb-3">
                        Pega la contraseña que deseas compartir. Se generará un enlace público con vigencia máxima de 7 días.
                    </p>
                    <form id="sharePasswordForm">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label for="sharePwText" class="form-label fw-semibold">Contraseña</label>
                            <textarea id="sharePwText" class="form-control text-monospace" rows="3"
                                      placeholder="Pega aquí la contraseña que deseas compartir…"
                                      maxlength="4096" required></textarea>
                        </div>
                        <div class="row">
                            <div class="col-6 mb-3">
                                <label for="sharePwDays" class="form-label fw-semibold">Vigencia (días)</label>
                                <input type="number" id="sharePwDays" class="form-control" min="1" max="7" value="7">
                                <div class="form-text">Máximo 7 días.</div>
                            </div>
                            <div class="col-6 mb-3">
                                <label for="sharePwMaxUses" class="form-label fw-semibold">Veces que se puede usar</label>
                                <input type="number" id="sharePwMaxUses" class="form-control" min="1" max="7" value="7">
                                <div class="form-text">Límite fijo de 7. Vacío = 7.</div>
                            </div>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-success btn-sm" onclick="submitSharePassword()" id="submitSharePwBtn">
                        <i class="bi bi-link-45deg"></i> Generar enlace
                    </button>
                </div>
            </div>

            <div id="sharePwResult" class="d-none">
                <div class="modal-body text-center py-4">
                    <i class="bi bi-check-circle-fill text-success" style="font-size: 2.2rem;"></i>
                    <h6 class="mt-2 mb-1">Enlace generado</h6>
                    <p class="text-muted small mb-3">Vigencia: <span id="sharePwDaysLabel">7</span> día(s).
                        Usos: <span id="sharePwUsesLabel">7</span>.
                        Expira: <span id="sharePwExpiresLabel">—</span></p>
                    <div class="input-group input-group-sm mb-3">
                        <input type="text" id="sharePwUrl" class="form-control font-monospace text-break" readonly>
                        <button class="btn btn-outline-secondary" type="button" onclick="copySharePwUrl()" title="Copiar enlace">
                            <i class="bi bi-clipboard"></i>
                        </button>
                    </div>
                </div>
                <div class="modal-footer justify-content-between">
                    <button type="button" class="btn btn-sm btn-outline-secondary" onclick="resetSharePwModal()">
                        <i class="bi bi-plus-lg"></i> Crear otro
                    </button>
                    <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Cerrar</button>
                </div>
            </div>

        </div>
    </div>
</div>

<script>
function submitSharePassword() {
    var pw = document.getElementById('sharePwText').value.trim();
    if (!pw) { document.getElementById('sharePwText').focus(); return; }
    var days = parseInt(document.getElementById('sharePwDays').value, 10) || 7;
    if (days < 1) days = 1;
    if (days > 7) days = 7;

    var maxUsesRaw = document.getElementById('sharePwMaxUses').value.trim();
    var maxUses = 7;
    if (maxUsesRaw) {
        maxUses = parseInt(maxUsesRaw, 10);
        if (isNaN(maxUses) || maxUses < 1) maxUses = 7;
        if (maxUses > 7) maxUses = 7;
    }

    var btn = document.getElementById('submitSharePwBtn');
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner-border spinner-border-sm"></span> Generando…';

    var fd = new FormData();
    fd.append('password', pw);
    fd.append('days', days);
    fd.append('max_uses', maxUses);
    var csrf = document.querySelector('input[name="csrfmiddlewaretoken"]');
    if (csrf) fd.append('csrfmiddlewaretoken', csrf.value);

    fetch("{% url 'passwords:shared_password_create' %}", {
        method: 'POST',
        body: fd,
        headers: { 'X-Requested-With': 'XMLHttpRequest' }
    })
    .then(function(r) {
        if (!r.ok && r.status === 403) {
            throw new Error('Solicitud rechazada (CSRF). Recarga la página y vuelve a intentarlo.');
        }
        if (!r.ok && r.status === 302) {
            throw new Error('Tu sesión expiró. Inicia sesión de nuevo.');
        }
        return r.json().catch(function() {
            if (!r.ok) {
                throw new Error('Error del servidor (' + r.status + '). Verifica que las migraciones estén aplicadas.');
            }
            throw new Error('Respuesta inesperada del servidor.');
        });
    })
    .then(function(data) {
        if (data.status === 'ok') {
            document.getElementById('sharePwUrl').value = data.url;
            document.getElementById('sharePwDaysLabel').textContent = data.days;
            document.getElementById('sharePwUsesLabel').textContent = data.max_uses || 7;
            document.getElementById('sharePwExpiresLabel').textContent = data.expires_at;
            document.getElementById('sharePwBody').classList.add('d-none');
            document.getElementById('sharePwResult').classList.remove('d-none');
        } else {
            alert(data.message || 'No se pudo generar el enlace.');
            btn.disabled = false;
            btn.innerHTML = '<i class="bi bi-link-45deg"></i> Generar enlace';
        }
    })
    .catch(function(err) {
        var msg = (err && err.message) ? err.message : 'Error de conexión al generar el enlace.';
        alert(msg);
        btn.disabled = false;
        btn.innerHTML = '<i class="bi bi-link-45deg"></i> Generar enlace';
    });
}

function copySharePwUrl() {
    var el = document.getElementById('sharePwUrl');
    el.select();
    navigator.clipboard.writeText(el.value).catch(function() {});
    var btn = el.nextElementSibling;
    btn.innerHTML = '<i class="bi bi-check"></i>';
    setTimeout(function() { btn.innerHTML = '<i class="bi bi-clipboard"></i>'; }, 2000);
}

function resetSharePwModal() {
    document.getElementById('sharePwText').value = '';
    document.getElementById('sharePwDays').value = '7';
    document.getElementById('sharePwMaxUses').value = '';
    document.getElementById('sharePwBody').classList.remove('d-none');
    document.getElementById('sharePwResult').classList.add('d-none');
    var btn = document.getElementById('submitSharePwBtn');
    btn.disabled = false;
    btn.innerHTML = '<i class="bi bi-link-45deg"></i> Generar enlace';
}
</script>
