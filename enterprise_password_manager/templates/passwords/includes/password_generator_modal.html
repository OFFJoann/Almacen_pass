<div class="modal fade" id="passwordGeneratorModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title"><i class="bi bi-dice-6"></i> Generador de Contraseñas</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <div class="mb-3">
                    <label class="form-label">Contraseña Generada</label>
                    <div class="input-group">
                        <input type="text" class="form-control font-monospace" id="generatedPassword" readonly>
                        <button class="btn btn-outline-secondary" onclick="copyGenerated()"><i class="bi bi-clipboard"></i></button>
                    </div>
                    <div class="d-flex align-items-center gap-2 mt-1">
                        <div class="progress flex-grow-1" style="height: 6px;">
                            <div class="progress-bar" id="strengthBar" role="progressbar" style="width: 0%"></div>
                        </div>
                        <small class="fw-semibold" id="strengthLabel">Entropía: <span id="passwordEntropy">0</span> bits</small>
                    </div>
                </div>
                <div class="row mb-3">
                    <div class="col-md-6">
                        <label class="form-label">Longitud</label>
                        <input type="range" class="form-range" id="passwordLength" min="8" max="128" value="24" oninput="updateGenerator()">
                        <span id="lengthValue">24</span>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Palabras (Frase)</label>
                        <input type="range" class="form-range" id="wordCount" min="2" max="10" value="4" oninput="updateGenerator()">
                        <span id="wordValue">4</span>
                    </div>
                </div>
                <div class="row">
                    <div class="col-md-6">
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="useUpper" checked onchange="updateGenerator()">
                            <label class="form-check-label">Mayúsculas (A-Z)</label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="useLower" checked onchange="updateGenerator()">
                            <label class="form-check-label">Minúsculas (a-z)</label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="useDigits" checked onchange="updateGenerator()">
                            <label class="form-check-label">Dígitos (0-9)</label>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="useSymbols" checked onchange="updateGenerator()">
                            <label class="form-check-label">Símbolos (!@#$%)</label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="excludeSimilar" onchange="updateGenerator()">
                            <label class="form-check-label">Excluir Similares (il1Lo0O)</label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="usePassphrase" onchange="togglePassphrase()">
                            <label class="form-check-label">Usar Frase</label>
                        </div>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="updateGenerator()"><i class="bi bi-arrow-repeat"></i> Regenerar</button>
                <button class="btn btn-primary" data-bs-dismiss="modal" onclick="usePassword()"><i class="bi bi-check-lg"></i> Usar Contraseña</button>
            </div>
        </div>
    </div>
</div>

<script>
    function updateGenerator() {
        var length = document.getElementById('passwordLength').value;
        var words = document.getElementById('wordCount').value;
        var passphrase = document.getElementById('usePassphrase').checked;
        document.getElementById('lengthValue').textContent = length;
        document.getElementById('wordValue').textContent = words;
        var url = "{% url 'passwords:password_generator' %}?length=" + length +
            "&upper=" + document.getElementById('useUpper').checked +
            "&lower=" + document.getElementById('useLower').checked +
            "&digits=" + document.getElementById('useDigits').checked +
            "&symbols=" + document.getElementById('useSymbols').checked +
            "&exclude_similar=" + document.getElementById('excludeSimilar').checked +
            "&passphrase=" + passphrase +
            "&num_words=" + words;
        fetch(url).then(r => r.json()).then(data => {
            document.getElementById('generatedPassword').value = data.password;
            document.getElementById('passwordEntropy').textContent = data.entropy;
            var e = data.entropy;
            var pct = Math.min(100, Math.round((e / 140) * 100));
            var bar = document.getElementById('strengthBar');
            var label = document.getElementById('strengthLabel');
            bar.style.width = pct + '%';
            if (e >= 128) { bar.className = 'progress-bar bg-dark'; label.className = 'fw-semibold text-dark'; }
            else if (e >= 80) { bar.className = 'progress-bar bg-success'; label.className = 'fw-semibold text-success'; }
            else if (e >= 60) { bar.className = 'progress-bar bg-info'; label.className = 'fw-semibold text-info'; }
            else if (e >= 36) { bar.className = 'progress-bar bg-warning'; label.className = 'fw-semibold text-warning'; }
            else { bar.className = 'progress-bar bg-danger'; label.className = 'fw-semibold text-danger'; }
        });
    }
    function togglePassphrase() {
        var checked = document.getElementById('usePassphrase').checked;
        document.getElementById('passwordLength').disabled = checked;
        document.getElementById('wordCount').disabled = !checked;
        document.getElementById('useUpper').disabled = checked;
        document.getElementById('useLower').disabled = checked;
        document.getElementById('useDigits').disabled = checked;
        document.getElementById('useSymbols').disabled = checked;
        document.getElementById('excludeSimilar').disabled = checked;
        updateGenerator();
    }
    function copyGenerated() {
        var input = document.getElementById('generatedPassword');
        copyToClipboard(input.value).then(function() {
            showToast('Contraseña copiada', 'success');
        });
    }
    function usePassword() {
        var password = document.getElementById('generatedPassword').value;
        var passwordField = document.querySelector('[name="password"]');
        if (passwordField) passwordField.value = password;
    }
    document.addEventListener('DOMContentLoaded', function() {
        updateGenerator();
    });
</script>
