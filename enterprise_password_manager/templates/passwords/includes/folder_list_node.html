{% for node in nodes %}
<li class="list-group-item" data-folder-row>
    <div class="d-flex align-items-center gap-2">
        <span class="folder-toggle" role="button" style="cursor:pointer;font-size:.75rem;width:1rem;flex:0 0 auto;text-align:center;" onclick="toggleFolderNode(this)">{% if node.children %}<i class="bi bi-chevron-right"></i>{% else %}<span style="display:inline-block;width:1rem;"></span>{% endif %}</span>
        <i class="bi bi-folder text-muted"></i>
        <span data-folder-name>{{ node.folder.name }}</span>
        <span class="badge bg-primary rounded-pill">{{ node.count }}</span>
        <a href="{% url 'passwords:folder_delete' node.folder.id %}" class="btn btn-sm btn-outline-danger ms-auto" title="Eliminar"><i class="bi bi-trash"></i></a>
        <button type="button" class="btn btn-sm btn-outline-secondary" title="Renombrar" onclick="renameInline(this)"><i class="bi bi-pencil"></i> Renombrar</button>
    </div>
    {% if node.children %}
    <ul class="list-group folder-children mt-1" style="display:none;margin-left:1.5rem;border-left:1px solid var(--bs-border-color);padding-left:.5rem;">
        {% include 'passwords/includes/folder_list_node.html' with nodes=node.children %}
    </ul>
    {% endif %}
</li>
{% endfor %}
