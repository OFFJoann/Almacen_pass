{% extends 'base.html' %}
{% block title %}Crear Carpeta{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm">
            <div class="card-body p-4">
                <h4 class="mb-4"><i class="bi bi-folder-plus"></i> Crear Carpeta
                    {% if parent %}<small class="text-muted">en «{{ parent.name }}»</small>{% endif %}
                </h4>
                <form method="post" novalidate>{% csrf_token %}{% for field in form %}<div class="mb-3"><label class="form-label">{{ field.label }}</label>{{ field }}</div>{% endfor %}<div class="d-flex gap-2"><button type="submit" class="btn btn-primary">Crear</button><a href="{% url 'passwords:vault' %}{% if parent %}?folder={{ parent.id }}{% endif %}" class="btn btn-outline-secondary">Cancelar</a></div></form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
