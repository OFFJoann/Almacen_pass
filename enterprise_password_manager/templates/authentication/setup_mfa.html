{% extends 'base.html' %}
{% load static %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm">
            <div class="card-body p-4">
                <h4 class="card-title mb-4"><i class="bi bi-shield-plus"></i> Configurar Autenticación de Dos Factores</h4>
                <div class="text-center mb-4">
                    <p class="text-muted">Escanea este código QR con tu app de autenticación:</p>
                    {% if qr_code %}
                        <img src="data:image/png;base64,{{ qr_code }}" alt="QR Code" class="img-fluid border p-2 rounded" style="max-width: 200px;">
                    {% endif %}
                    <p class="mt-3">
                        <small class="text-muted">O ingresa esta clave manualmente:</small>
                        <br>
                        <code class="user-select-all">{{ secret }}</code>
                    </p>
                </div>
                <form method="post" novalidate>
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label">Verifica el código de tu app:</label>
                        {{ form.code }}
                    </div>
                    <button type="submit" class="btn btn-primary w-100">
                        <i class="bi bi-check-lg"></i> Activar MFA
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
