{% extends 'base.html' %}
{% block theme %}light{% endblock %}
{% block body_class %}bg-light{% endblock %}
{% block auth_content %}
<div class="container">
    <div class="row justify-content-center align-items-center min-vh-100">
        <div class="col-md-5 text-center">
            <i class="bi bi-shield-exclamation display-1 text-danger"></i>
            <h3 class="mt-3">Cuenta Bloqueada</h3>
            <p class="text-muted">Demasiados intentos fallidos. Intenta de nuevo en 30 minutos.</p>
            <a href="{% url 'authentication:login' %}" class="btn btn-primary">Volver al inicio</a>
        </div>
    </div>
</div>
{% endblock %}
