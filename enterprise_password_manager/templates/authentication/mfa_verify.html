{% extends 'base.html' %}

{% block body_class %}bg-light{% endblock %}

{% block auth_content %}
<div class="container">
    <div class="row justify-content-center align-items-center min-vh-100">
        <div class="col-md-4">
            <div class="text-center mb-4">
                <i class="bi bi-shield-check display-1 text-primary"></i>
                <h3>Autenticación de Dos Factores</h3>
                <p class="text-muted">Ingresa el código de tu app de autenticación</p>
            </div>
            <div class="card shadow-sm border-0">
                <div class="card-body p-4">
                    <form method="post" novalidate>
                        {% csrf_token %}
                        <div class="mb-4">
                            <label class="form-label">Código de Autenticación</label>
                            {{ form.code }}
                        </div>
                        <button type="submit" class="btn btn-primary w-100 btn-lg">
                            <i class="bi bi-check-lg"></i> Verificar
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
